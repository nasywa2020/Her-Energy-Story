<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HER ENERGY GAMES</title>
<style>
:root{--ink:#10343a;--paper:#fff8ea;--sun:#f2a93b;--water:#1d6f7a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink);background:#0d2b30}
#game{max-width:640px;margin:auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--paper)}
#hero{position:relative;height:33%;min-height:170px;flex:none;overflow:hidden}
#sky{position:absolute;inset:0;transition:background 1.6s}
#world{position:absolute;inset:0;width:100%;height:100%}
#sun{transition:transform 1.6s,fill 1.6s}
.wave{animation:wv 7s ease-in-out infinite alternate}.wave.b{animation-duration:9s;animation-direction:alternate-reverse}
@keyframes wv{to{transform:translateX(-60px)}}
.cloud{animation:dr 40s linear infinite}.cloud.c2{animation-duration:62s;animation-delay:-20s}
@keyframes dr{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
.boat{animation:bt 4s ease-in-out infinite alternate}@keyframes bt{to{transform:translateY(5px) rotate(3deg)}}
.panels rect{animation:gl 3s ease-in-out infinite}.panels rect:nth-child(2n){animation-delay:.9s}
@keyframes gl{50%{fill:#6bb2ea}}
.bird{animation:fl 14s linear infinite}@keyframes fl{from{transform:translate(-60px,0)}to{transform:translate(860px,-30px)}}
#chip{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-size:12px}
#chip span{background:#fff8eae6;padding:5px 10px;border-radius:20px;font-weight:bold;animation:fi .6s both}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}}
#por{position:absolute;left:14px;bottom:26px;width:92px;height:92px;border-radius:50%;border:4px solid #fff;background:linear-gradient(#fff8ea,#ffe3a8);overflow:hidden;box-shadow:0 6px 16px #0006;animation:pp .5s both}
@keyframes pp{from{transform:scale(.3);opacity:0}}
#pn{position:absolute;left:14px;bottom:6px;font-size:12px;font-weight:bold;background:var(--ink);color:#fff;padding:2px 10px;border-radius:12px;max-width:110px}
#hud{flex:none;display:flex;gap:4px;padding:18px 8px 6px;background:var(--paper);border-radius:20px 20px 0 0;margin-top:-16px;position:relative;z-index:3}
.m{flex:1;font-size:10px;text-align:center;min-width:0}.m i{display:block;height:6px;background:#10343a22;border-radius:4px;overflow:hidden;margin-top:2px}
.m b{display:block;height:100%;width:0;background:var(--water);transition:width .8s}
.fl{position:absolute;top:-4px;font-size:12px;font-weight:bold;color:#127a3a;background:#fff;padding:1px 8px;border-radius:10px;box-shadow:0 2px 6px #0003;animation:up 1.6s both;pointer-events:none}
@keyframes up{to{transform:translateY(-26px);opacity:0}}
#chat{flex:1;overflow-y:auto;padding:6px 12px 10px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth}
.row{display:flex;gap:8px;align-items:flex-end;animation:in .35s both}.row.me{flex-direction:row-reverse}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.ph{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;background:linear-gradient(#fff,#ffe3a8);border:2px solid #fff;box-shadow:0 2px 6px #0003}
.bb{max-width:76%;padding:9px 12px;border-radius:16px 16px 16px 4px;background:#fff;box-shadow:0 2px 6px #10343a22;line-height:1.6;font-size:17px}
.bb small{display:block;font-weight:bold;font-size:11px;margin-bottom:2px;color:var(--water)}
.me .bb{background:var(--water);color:#fff;border-radius:16px 16px 4px 16px}
.nr{align-self:center;text-align:center;font-size:15px;font-style:italic;background:#ffe9bd;padding:6px 12px;border-radius:12px;max-width:90%;animation:in .4s both}
.dv{align-self:center;font-size:12px;font-weight:bold;color:#fff;background:var(--ink);padding:4px 14px;border-radius:14px;animation:in .4s both}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#10343a88;animation:dt 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dt{50%{transform:translateY(-5px)}}
#dock{flex:none;padding:8px 10px 12px;background:#ffe9bd;display:none;flex-direction:column;gap:7px;max-height:44%;overflow-y:auto;border-top:2px solid #f2a93b66}
#dock .lb{font-size:11px;font-weight:bold;opacity:.7}
button{font:inherit;cursor:pointer;text-align:left;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;padding:8px 12px;transition:transform .15s,background .15s;animation:in .3s both}
button small{display:block;font-size:11px;opacity:.65;margin-bottom:2px}
button:hover:not(:disabled){transform:translateX(4px);background:#fff2d3}
button:disabled{opacity:.45;cursor:not-allowed}button.go{background:var(--ink);color:#fff;text-align:center}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input{font:inherit;width:100%;padding:10px;border:2px solid var(--ink);border-radius:12px}
.pm{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.pm span{font-size:12px;padding:3px 8px;border-radius:20px;background:#10343a22}.pm .on{background:var(--water);color:#fff}
.end{align-self:center;width:100%;background:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:0 6px 18px #10343a33;animation:in .6s both}
.end h2{margin:6px 0;font-family:Georgia,serif}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bb,.nr{word-break:break-word}
button{font-size:16px}
.cbox{display:flex;flex-direction:column;gap:9px;background:#ffe9bd;border-radius:16px;padding:12px;animation:in .4s both}
.cbox .lb{font-size:13px;font-weight:bold}
.cbox button{padding:12px 14px}
.ct{align-self:center;background:var(--ink);color:#fff;border-radius:26px;padding:11px 30px;font-size:16px;text-align:center;animation:in .4s both,pu 1.8s 1s infinite}
@keyframes pu{50%{transform:scale(1.06)}}
#chat::after{content:"";flex:none;height:32vh}
.wt,.hl1,.hl2{transition:fill 1.5s}
#game.d1{--water:#c4682a}#game.d2{--water:#1d6f7a}#game.d3{--water:#1b7fa0}#game.d4{--water:#b5532f}#game.d5{--water:#6a4496}#game.d6{--water:#3f5f7a}#game.d7{--water:#27386e}
.d1 .wt{fill:#e29a6a}.d3 .wt{fill:#2a9bb5}.d4 .wt{fill:#d08a50}.d5 .wt{fill:#2a7f8c}.d6 .wt{fill:#4b6677}.d7 .wt{fill:#14284a}
.d4 .hl1{fill:#6b6a3a}.d4 .hl2{fill:#8a8a4c}.d6 .hl1{fill:#3f5248}.d6 .hl2{fill:#587062}.d7 .hl1{fill:#10231d}.d7 .hl2{fill:#1a3528}
#rain,#stars,#flags,#stall{opacity:0;transition:opacity 1.2s}
.d6 #rain{opacity:1}.d7 #stars{opacity:1}.d5 #flags{opacity:1}.d3 #stall{opacity:1}
.d6 .cloud ellipse{fill:#6d7884}.d6 .bird,.d7 .bird{opacity:0}.d7 .cloud{opacity:.15}
#rain line{stroke:#d5e6f3;stroke-width:2;animation:rn .8s linear infinite}
@keyframes rn{from{transform:translateY(-40px)}to{transform:translateY(300px)}}
#stars circle{fill:#fff;animation:tw 2.5s ease-in-out infinite alternate}#stars .ff{fill:#ffe66d;animation:ffl 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.2}}@keyframes ffl{to{transform:translate(30px,-24px);opacity:.3}}
#flags polygon{transform-origin:top;animation:fw 2s ease-in-out infinite alternate}@keyframes fw{to{transform:rotate(8deg)}}
#dayov{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;transition:opacity .7s;cursor:pointer;padding:20px;text-shadow:0 2px 12px #0006}
#dayov small{letter-spacing:.3em;font-size:18px}
#dayov b{font-family:Georgia,serif;font-size:120px;line-height:1;display:block;animation:flip 1s both}
@keyframes flip{from{transform:rotateX(90deg) scale(.5);opacity:0}}
#dem{font-size:64px;animation:rs 1.4s both}@keyframes rs{from{transform:translateY(60px);opacity:0}}
#dti{font-size:22px;font-family:Georgia,serif;animation:fi .8s .6s both}
.dpg{display:flex;gap:8px;margin-top:10px}.dpg i{width:12px;height:12px;border-radius:50%;background:#ffffff55}.dpg i.on{background:#fff;transform:scale(1.3)}
#dayov .tap{font-size:13px;opacity:.85;animation:fi 1s 1.6s both}
.end{text-align:left}.end small{font-size:11px;letter-spacing:.1em;color:var(--water);font-weight:bold}.pf{background:#fff8ea;border-radius:12px;padding:12px;margin-top:10px}.bl{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}.bt{height:7px;background:#10343a22;border-radius:4px;overflow:hidden}.bt i{display:block;height:100%;background:var(--water)}.cbox button b{display:block}
#hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;padding:18px 12px 8px}
.m{text-align:left;font-size:11px}.m .lbl{white-space:nowrap;overflow:hidden;font-weight:bold}
.m .bw{display:flex;align-items:center;gap:5px;margin-top:2px}.m .bw i{flex:1;margin-top:0;height:7px}
.m strong{font-size:11px;min-width:20px;text-align:right}
.fl.neg{color:#b3261e}
#snd{position:absolute;right:10px;bottom:8px;z-index:5;padding:3px 10px;border-radius:20px;font-size:16px;background:#fff8eae6;border-width:1px}
.cover{align-self:center;width:100%;text-align:center;background:#fff;border-radius:18px;padding:18px 16px;box-shadow:0 6px 18px #10343a33;animation:in .6s both}
.cover small{font-size:11px;letter-spacing:.14em;color:var(--water);font-weight:bold}
.cover h1{font-family:Georgia,serif;font-size:32px;letter-spacing:.08em;margin:6px 0 2px}
.cover .tg{font-style:italic;font-size:15px;margin-bottom:10px}
.cover .nw{background:#ffe9bd;border-radius:12px;padding:9px 12px;font-weight:bold;font-size:15px;line-height:1.5}
.cover .rl{text-align:left;font-size:15px;line-height:1.6;margin:12px 0 4px;padding-left:20px}
.cover .rl li{margin-bottom:5px}.cover .cn{font-size:12px;opacity:.75;margin:8px 0 0;line-height:1.5}
.end .ed{font-style:italic;font-size:15px;margin:4px 0 8px}
.pm span{font-weight:bold}.pm span:not(.on){opacity:.55}
.pt{font-size:12px;font-weight:bold;margin-top:12px}.pc{font-size:11px;opacity:.7;margin:0}
.rc{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.5}.rc li{margin-bottom:6px}

#por,.ph{background:linear-gradient(#d6ecd8,#fff0c8)}
.nar .bb{background:#ffe9bd;font-style:italic}
#game{--tint:#fff;--ta:0}
#game.d1{--tint:#f0884a;--ta:.2}#game.d4{--tint:#e8913a;--ta:.2}#game.d5{--tint:#8a5ab5;--ta:.16}#game.d6{--tint:#4b5b6b;--ta:.38}#game.d7{--tint:#0b1a3a;--ta:.55}
.win{fill:#7a5a3a}.d7 .win,.d1 .win{fill:#ffd57a}
.d6 .cloud circle{fill:#6d7884}
#page2{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(#bfe3d0,#fff8ea 45%);display:none;z-index:50}
.pg{max-width:640px;margin:auto;padding:20px 14px 40px}.pg .end{box-shadow:0 6px 18px #10343a33}
